services:

  # =========================
  # Nginx Reverse Proxy
  # =========================
  nginx:
    image: nginx:alpine
    container_name: url-shortener-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - url-network

    restart: unless-stopped


  # =========================
  # FastAPI Application
  # =========================
  app:
    image: url-shortener:v1.0
    container_name: url-shortener-app

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BASE_URL: ${BASE_URL}

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - url-network

    restart: unless-stopped


  # =========================
  # PostgreSQL Database
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - url-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # =========================
  # Redis Cache
  # =========================
  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - url-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


# =========================
# Persistent Volumes
# =========================
volumes:

  postgres-data:
    driver: local

  redis-data:
    driver: local


# =========================
# Custom Network
# =========================
networks:

  url-network:
    driver: bridge
